name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  wii:
    runs-on: ubuntu-latest
    # devkitPPC + libogc2 + libogc2-cmake + the libogc2 portlibs
    # (devkitpro/devkitppc + `wii-dev` is plain libogc, whose portlibs are not ABI compatible.)
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # supermariowar (+ its data) and SDL3-libogc2

      # The wrapper CMakeLists does find_package(SDL3 REQUIRED), so SDL3 has to be installed first.
      # Default install prefix with this toolchain is ${DEVKITPRO}/libogc2/wii, which is already
      # on the toolchain's search path.
      - name: Build and install SDL3 (libogc2 fork)
        run: |
          cmake -S SDL3-libogc2 -B build-sdl \
            -DCMAKE_TOOLCHAIN_FILE=${DEVKITPRO}/cmake/Wii.cmake \
            -DDKP_OGC_PLATFORM_LIBRARY=libogc2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_LIBICONV=OFF -DSDL_SYSTEM_ICONV=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl -j$(nproc)
          cmake --install build-sdl

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${DEVKITPRO}/cmake/Wii.cmake \
            -DDKP_OGC_PLATFORM_LIBRARY=libogc2 \
            -DCMAKE_BUILD_TYPE=Release

      # boot.dol is produced by the smw_dol target, not by smw
      - name: Build
        run: cmake --build build --target smw_dol -j$(nproc)

      - name: Record toolchain and source versions
        if: always()
        run: |
          mkdir -p debug
          {
            echo "== compiler ==";  ${DEVKITPPC}/bin/powerpc-eabi-gcc --version | head -1
            echo "== packages ==";  (dkp-pacman -Q devkitPPC libogc2 || pacman -Q devkitPPC libogc2) 2>&1
            echo "== sources ==";   echo "SDL3-libogc2 $(git -C SDL3-libogc2 rev-parse HEAD)"
                                    echo "supermariowar $(git -C supermariowar rev-parse HEAD)"
                                    echo "smw-wii ${GITHUB_SHA}"
          } | tee debug/versions.txt

      - name: Collect link map and ELF
        if: always()
        run: |
          cp build/smw.map debug/ || true
          find build -type f -name smw.elf -exec cp {} debug/smw.elf \; || true
          ${DEVKITPPC}/bin/powerpc-eabi-size -A debug/smw.elf > debug/sections.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smw-wii-debug
          path: debug/
          if-no-files-found: warn

      - name: Package
        run: |
          D=dist/apps/smw
          mkdir -p $D
          cp build/boot.dol $D/
          cp hbc/meta.xml hbc/icon.png $D/ || true
          mkdir -p dist/smw
          cp -r supermariowar/data dist/smw/data && rm -rf dist/smw/data/.git

      - uses: actions/upload-artifact@v4
        with:
          name: smw-wii
          path: dist/

  wiiu:
    runs-on: ubuntu-latest
    continue-on-error: true # ignore the failure for now - the SDL3 Wii U port is still being written
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # supermariowar (+ its data). SDL3-wut is `update = none`: fetched below.

      - name: Fetch SDL3 (Wii U fork)
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --checkout --depth 1 SDL3-wut

      # The wrapper CMakeLists does find_package(SDL3 REQUIRED), so SDL3 has to be installed first.
      # WiiU.cmake's install prefix is ${DEVKITPRO}/portlibs/wiiu, which is on the toolchain's search path.
      - name: Build and install SDL3 (Wii U fork)
        run: |
          cmake -S SDL3-wut -B build-sdl \
            -DCMAKE_TOOLCHAIN_FILE=${DEVKITPRO}/cmake/WiiU.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_LIBICONV=OFF -DSDL_SYSTEM_ICONV=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl -j$(nproc)
          cmake --install build-sdl

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${DEVKITPRO}/cmake/WiiU.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Record toolchain and source versions
        if: always()
        run: |
          mkdir -p debug
          {
            echo "== compiler ==";  ${DEVKITPPC}/bin/powerpc-eabi-gcc --version | head -1
            echo "== packages ==";  dkp-pacman -Q devkitPPC wut wut-tools wiiu-cmake 2>&1
            echo "== sources ==";   echo "SDL3-wut $(git -C SDL3-wut rev-parse HEAD)"
                                    echo "supermariowar $(git -C supermariowar rev-parse HEAD)"
                                    echo "smw-wii ${GITHUB_SHA}"
          } | tee debug/versions.txt

      - name: Collect link map and ELF
        if: always()
        run: |
          cp build/smw.map debug/ || true
          find build -type f -name smw.elf -exec cp {} debug/smw.elf \; || true
          ${DEVKITPPC}/bin/powerpc-eabi-size -A debug/smw.elf > debug/sections.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smw-wiiu-debug
          path: debug/
          if-no-files-found: warn

      - name: Package
        run: |
          mkdir -p dist/wiiu/apps dist/smw
          cp build/smw.wuhb dist/wiiu/apps/
          cp -r supermariowar/data dist/smw/data && rm -rf dist/smw/data/.git

      - uses: actions/upload-artifact@v4
        with:
          name: smw-wiiu
          path: dist/
